name: day-perspective

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: day_perspective
      POSTGRES_USER: day_perspective
      POSTGRES_PASSWORD: day_perspective
    ports:
      - "54329:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U day_perspective -d day_perspective"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:

